<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Principal</title>
  <style>
    :root {
      --color-primario: #004445;
      --color-claro: #f5f5f5;
      --color-texto: #222;
      --color-secundario: #007f7f;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--color-claro);
      color: var(--color-texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      color: var(--color-primario);
      margin-bottom: 2rem;
      text-align: center;
    }

    .opciones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .card {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .card h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--color-primario);
    }

    @media (min-width: 600px) {
      .opciones {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <h1>Menú Principal</h1>
  <div class="opciones">
    <div class="card" onclick="irA('registrar.html')">
      <h2>Registrar Venta</h2>
    </div>
    <div class="card" onclick="irA('ventas.html')">
      <h2>Ver Ventas</h2>
    </div>
    <div class="card" onclick="irA('arqueo.html')">
      <h2>Arqueo</h2>
    </div>
  </div>

  <script>
    function irA(ruta) {
      window.location.href = ruta;
    }
  </script>
</body>
</html>
